name: Deploy to production

on:
  push:
    branches: ["master"]

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-3

      - name: Login to Amazon ECR
        id: login-ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Generate app.env file
        run: |
          touch app.env
          echo "DB_DRIVER=postgres" >> app.env
          echo "DB_SOURCE=postgresql://dummy_user:dummy_pass@localhost:5432/simple_bank" >> app.env
          echo "SERVER_ADDRESS=0.0.0.0:8080" >> app.env
          echo "TOKEN_SECRET=12345678901234567890123456789012" >> app.env
          echo "ACCESS_TOKEN_DURATION=15m" >> app.env

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }} 
          ECR_REPOSITORY: simplebank
          IMAGE_TAG: ${{ github.sha }}
          
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG